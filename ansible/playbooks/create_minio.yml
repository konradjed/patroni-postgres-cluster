---
- name: Prepare minio s3 bucket
  hosts: minio
  become: true
  tasks:
    - name: Add ports
      ansible.posix.firewalld:
        zone: public
        permanent: true
        port: "{{ item }}"
        state: enabled
        immediate: true
      loop:
        - 9001/tcp
        - 9000/tcp

    - name: Download minio.rpm
      ansible.builtin.uri:
        follow_redirects: all
        url: "https://dl.min.io/aistor/minio/release/linux-amd64/minio.rpm"
        dest: "/tmp/minio.rpm"
        status_code: [200, 304]

    - name: Install minio.rpm
      ansible.builtin.dnf:
        name: /tmp/minio.rpm
        state: present
        disable_gpg_check: true

    - name: Create minio config directory
      ansible.builtin.file:
        path: /opt/minio
        state: directory
        owner: minio-user
        group: minio-user
        mode: '0750'

    - name: Add license
      ansible.builtin.copy:
        src: minio.license
        dest: /opt/minio/minio.license
        owner: minio-user
        group: minio-user
        mode: '0640'

    - name: Configure volumes
      ansible.builtin.copy:
        content: |
            MINIO_LICENSE="/opt/minio/minio.license"
            MINIO_VOLUMES="/mnt/drive-1/minio"
            MINIO_ROOT_USER="{{ minio_admin_username }}"
            MINIO_ROOT_PASSWORD="{{ minio_admin_password }}"
            MINIO_OPTS="--certs-dir /opt/minio/certs"
        dest: /etc/default/minio
        mode: '0640'
        owner: minio-user
        group: minio-user

    - name: Configure minio disk
      ansible.builtin.file:
        state: directory
        path: /mnt/drive-1/minio
        owner: minio-user
        group: minio-user
        mode: '0750'

    - name: Create minio certs dir
      ansible.builtin.file:
        state: directory
        path: "{{ item }}"
        owner: minio-user
        group: minio-user
        mode: '0750'
      loop:
        - /opt/minio/certs
        - /opt/minio/certs/CAs

    - name: Copy minio certs
      ansible.builtin.copy:
        src: "{{ item.src }}"
        dest: "{{ item.dest }}"
        owner: minio-user
        group: minio-user
        mode: "{{ '0600' if item.src == 'private.key' else '0644' }}"
      loop:
        - { src: "public.crt", dest: "/opt/minio/certs/public.crt" }
        - { src: "private.key", dest: "/opt/minio/certs/private.key" }
        - { src: "ca.crt", dest: "/opt/minio/certs/CAs/ca.crt" }

    - name: Enable service
      ansible.builtin.systemd_service:
        state: started
        enabled: true
        name: minio.service
      register: minio_start_output

    - name: Print minio start output
      ansible.builtin.debug:
        msg: "Minio start output for {{ inventory_hostname }}: {{ minio_start_output }}"

    - name: Minio service status
      ansible.builtin.service_facts:
    - name: Print Minio status
      ansible.builtin.debug:
        msg: "Minio status for {{ inventory_hostname }}: {{ ansible_facts.services['minio.service'].state }}"

    - name: Install minio cli
      ansible.builtin.get_url:
        url: "https://dl.min.io/aistor/mc/release/linux-amd64/mc"
        dest: /usr/local/bin/mcli
        mode: '0755'

    - name: Create mcli CA dir
      ansible.builtin.file:
        path: /root/.mcli/certs/CAs
        state: directory
        owner: root
        group: root
        mode: '0755'

    - name: Trust the cluster CA in mcli
      ansible.builtin.copy:
        src: ca.crt
        dest: /root/.mcli/certs/CAs/ca.crt
        owner: root
        group: root
        mode: '0644'

    - name: Create alias
      ansible.builtin.command:
        cmd: /usr/local/bin/mcli alias set patroni https://{{ ansible_host }}:9000 {{ minio_admin_username }} {{ minio_admin_password }}
      changed_when: false

    - name: Create bucket
      ansible.builtin.command:
        cmd: /usr/local/bin/mcli mb patroni/{{ patroni_s3_bucket_name }}
      register: minio_bucket_creation
      changed_when: minio_bucket_creation.rc == 0 and "Bucket created successfully patroni/{{ patroni_s3_bucket_name }}" in minio_bucket_creation.stdout
      failed_when: minio_bucket_creation.rc != 0 and "Bucket created successfully patroni/{{ patroni_s3_bucket_name }}" not in minio_bucket_creation.stdout
