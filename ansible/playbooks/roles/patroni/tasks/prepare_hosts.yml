---

- name: Verify required passwords are provided
  ansible.builtin.assert:
    that:
      - patroni_postgres_password | default('') | length > 0
      - patroni_replicator_password | default('') | length > 0
    fail_msg: >-
      Please set patroni_postgres_password and patroni_replicator_password.
    success_msg: "Passwords have been set."

- name: Verify supported operating system
  ansible.builtin.assert:
    that:
      - ansible_facts['distribution'] == 'Rocky'
      - ansible_facts['distribution_major_version'] == '9'
      - ansible_facts['service_mgr'] == 'systemd'
    fail_msg: >-
      Unsupported system.
      This role requires Rocky Linux 9 with systemd.
    success_msg: "Supported system: Rocky Linux 9 with systemd."

- name: Set hostname
  ansible.builtin.hostname:
    name: "{{ inventory_hostname }}"
    use: systemd

- name: Set hosts file
  ansible.builtin.lineinfile:
    path: /etc/hosts
    line: "{{ hostvars[item].ansible_host }} {{ item }}"
    regexp: "[[:space:]]{{ item }}$"
    insertafter: EOF
    state: present
  loop: "{{ groups['psql'] }}"

- name: Install repository prerequisites
  ansible.builtin.dnf:
    name:
      - curl
      - dnf-plugins-core
      - epel-release
      - firewalld
      - python3-firewall
    state: present
  register: repo_prereqs
  retries: 5
  delay: 15
  until: repo_prereqs is succeeded

- name: Read the enabled DNF repositories
  ansible.builtin.command: dnf repolist --enabled
  register: list_enabled_repos
  changed_when: false

- name: Enable the CodeReady Builder and EPEL repositories
  ansible.builtin.command: dnf config-manager --set-enabled {{ item }}
  loop:
    - crb
    - epel
  when: item not in (list_enabled_repos.stdout_lines | map('regex_replace', '\\s.*$', '') | list)

- name: Import Percona GPG key
  ansible.builtin.rpm_key:
    key: https://repo.percona.com/yum/PERCONA-PACKAGING-KEY
    state: present
  register: percona_key
  retries: 5
  delay: 15
  until: percona_key is succeeded

- name: Install percona-release
  ansible.builtin.dnf:
    name: 'https://repo.percona.com/yum/percona-release-latest.noarch.rpm'
    state: present
  register: percona_release
  retries: 5
  delay: 15
  until: percona_release is succeeded

- name: Execute percona release script
  ansible.builtin.command: percona-release setup -y ppg18
  args:
    creates: /etc/yum.repos.d/percona-ppg-18-release.repo

- name: Install cluster packages
  ansible.builtin.dnf:
    name:
      - etcd
      - python3-python-etcd
      - percona-postgresql18-server
      - python3-pip
      - python3-devel
      - binutils
      - percona-patroni
    state: present
  register: cluster_packages
  retries: 5
  delay: 15
  until: cluster_packages is succeeded

# Configure Firewalld
- name: Systemd config
  ansible.builtin.systemd_service:
    name: "{{ item.service }}"
    state: "{{ item.state }}"
    enabled: "{{ item.enabled }}"
    masked: "{{ item.masked }}"
  loop:
    - { service: "firewalld", enabled: true, state: started, masked: false }
    - { service: "etcd", enabled: false, state: stopped, masked: false }
    - { service: "patroni", enabled: false, state: stopped, masked: true }
    - { service: "postgresql-18", enabled: false, state: stopped, masked: true }

- name: Gather service facts
  ansible.builtin.service_facts:

- name: Stop existing Percona Patroni
  ansible.builtin.systemd_service:
    name: percona-patroni
    state: stopped
    enabled: false
    masked: false
  when: "'percona-patroni.service' in ansible_facts.services"

- name: Create patroni zone
  ansible.posix.firewalld:
    zone: "{{ patroni_firewall_zone }}"
    state: present
    permanent: true

- name: Set default-deny
  ansible.posix.firewalld:
    zone: "{{ patroni_firewall_zone }}"
    target: DROP
    state: present
    permanent: true
    immediate: false

- name: Reload firewalld
  ansible.builtin.command: firewall-cmd --reload

# Must be allowed before the source binding, otherwise SSH from patroni_subnet can be rejected
- name: Allow SSH in patroni zone
  ansible.posix.firewalld:
    zone: "{{ patroni_firewall_zone }}"
    rich_rule: >-
      rule family="ipv4" source address="{{ patroni_management_cidr }}"
      service name="ssh" accept
    state: enabled
    permanent: true
    immediate: true

- name: Collect nodes ip addresses
  ansible.builtin.set_fact:
    patroni_nodes_ips: "{{ groups['psql'] | map('extract', hostvars, 'ansible_host') | list }}"

- name: Allow on traffic between postgres nodes
  ansible.posix.firewalld:
    zone: "{{ patroni_firewall_zone }}"
    rich_rule: >-
      rule family="ipv4" source address="{{ item.0 }}/32"
      port port="{{ item.1 }}" protocol="tcp" accept
    state: enabled
    permanent: true
    immediate: true
  with_nested:
    - "{{ patroni_nodes_ips }}"
    - "{{ patroni_firewall_ports }}"

- name: Allow on access to PostgreSQL
  ansible.posix.firewalld:
    zone: "{{ patroni_firewall_zone }}"
    rich_rule: >-
      rule family="ipv4" source address="{{ item }}"
      port port="5432" protocol="tcp" accept
    state: enabled
    permanent: true
    immediate: true
  loop: "{{ patroni_app_cidrs }}"

- name: Check default zone
  ansible.builtin.command: firewall-cmd --get-default-zone
  register: patroni_default_zone
  changed_when: false

- name: Set default zone
  ansible.builtin.command: firewall-cmd --set-default-zone={{ patroni_firewall_zone }}
  when: patroni_default_zone.stdout | trim != patroni_firewall_zone
  changed_when: true
