---

- name: Resolve each data volume to a block device by size
  ansible.builtin.shell: |
    set -o pipefail
    lsblk -bdno NAME,SIZE --nodeps | awk -v want="{{ (item.gib | int) * 1024 * 1024 * 1024 }}" '
      $2 >= want * 0.98 && $2 <= want * 1.02 { print "/dev/" $1 }'
  args:
    executable: /bin/bash
  register: patroni_volume_devices
  changed_when: false
  loop: "{{ patroni_data_volumes }}"
  loop_control:
    label: "{{ item.name }} ({{ item.gib }}GiB)"

- name: Assert exactly one device matched each volume
  ansible.builtin.assert:
    that:
      - (item.stdout_lines | length) == 1
    fail_msg: >-
      Expected exactly one {{ item.item.gib }}GiB device for {{ item.item.name }},
      found {{ item.stdout_lines | length }}. Volume sizes must be distinct
      from each other and from the root disk.
  loop: "{{ patroni_volume_devices.results }}"
  loop_control:
    label: "{{ item.item.name }}"

- name: Build the volume map
  ansible.builtin.set_fact:
    patroni_volumes: >-
      {{ patroni_volumes | default([]) + [item.item | combine({
           'device': item.stdout_lines[0],
           'mapper': 'patroni-' ~ item.item.name,
           'keyfile': patroni_luks_key_dir ~ '/' ~ item.item.name ~ '.key'
         })] }}
  loop: "{{ patroni_volume_devices.results }}"
  loop_control:
    label: "{{ item.item.name }} -> {{ item.stdout_lines[0] }}"

- name: Create the configuration directory
  ansible.builtin.file:
    path: "{{ patroni_luks_key_dir | dirname }}"
    state: directory
    owner: root
    group: root
    mode: '0755'

- name: Create the LUKS key directory
  ansible.builtin.file:
    path: "{{ patroni_luks_key_dir }}"
    state: directory
    owner: root
    group: root
    mode: '0700'

- name: Generate a keyfile for each volume
  ansible.builtin.shell: |
    set -o pipefail
    umask 077
    head -c 512 /dev/urandom > "{{ item.keyfile }}"
    chmod 400 "{{ item.keyfile }}"
  args:
    executable: /bin/bash
    creates: "{{ item.keyfile }}"
  loop: "{{ patroni_volumes }}"
  loop_control:
    label: "{{ item.keyfile }}"

- name: Encrypt, open and format each data volume
  ansible.builtin.shell: |
    set -euo pipefail
    device="{{ item.device }}"
    mapper="{{ item.mapper }}"
    keyfile="{{ item.keyfile }}"
    changed=""

    if ! cryptsetup isLuks "$device"; then
      for mounted in $(findmnt -rno TARGET,SOURCE | awk -v d="$device" '$2 ~ "^"d {print $1}'); do
        umount "$mounted"
      done
      wipefs -a "$device" >/dev/null
      cryptsetup luksFormat --type luks2 --batch-mode --key-file "$keyfile" "$device"
      changed="yes"
    fi

    if [ ! -e "/dev/mapper/$mapper" ]; then
      cryptsetup luksOpen --key-file "$keyfile" "$device" "$mapper"
      changed="yes"
    fi

    if [ "$(lsblk -dno FSTYPE "/dev/mapper/$mapper")" != "{{ patroni_volume_fstype }}" ]; then
      mkfs.{{ patroni_volume_fstype }} -q -f "/dev/mapper/$mapper"
      changed="yes"
    fi

    [ -n "$changed" ] && echo changed || true
  args:
    executable: /bin/bash
  register: patroni_volume_luks
  changed_when: "'changed' in patroni_volume_luks.stdout"
  loop: "{{ patroni_volumes }}"
  loop_control:
    label: "{{ item.name }} on {{ item.device }}"

- name: Read each volume's LUKS UUID
  ansible.builtin.command: "cryptsetup luksUUID {{ item.device }}"
  register: patroni_luks_uuids
  changed_when: false
  loop: "{{ patroni_volumes }}"
  loop_control:
    label: "{{ item.name }}"

- name: Configure unattended unlock at boot
  ansible.builtin.template:
    src: crypttab.j2
    dest: /etc/crypttab
    owner: root
    group: root
    mode: '0600'
  vars:
    patroni_crypttab_entries: "{{ patroni_volumes | zip(patroni_luks_uuids.results | map(attribute='stdout') | list) | list }}"

- name: Install the mount guard used by the service units
  ansible.builtin.copy:
    src: patroni-require-volume
    dest: /usr/local/sbin/patroni-require-volume
    owner: root
    group: root
    mode: '0755'

- name: Mount each data volume and persist it in fstab
  ansible.posix.mount:
    path: "{{ item.path }}"
    src: "/dev/mapper/{{ item.mapper }}"
    fstype: "{{ patroni_volume_fstype }}"
    opts: defaults
    state: mounted
  loop: "{{ patroni_volumes }}"
  loop_control:
    label: "{{ item.path }} <- /dev/mapper/{{ item.mapper }}"

- name: Set ownership of each mounted volume
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: "{{ item.owner }}"
    group: "{{ item.owner }}"
    mode: '0700'
  loop: "{{ patroni_volumes }}"
  loop_control:
    label: "{{ item.path }}"
