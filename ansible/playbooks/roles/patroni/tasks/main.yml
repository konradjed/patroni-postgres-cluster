---
# tasks file for patroni
- name: Prepare system
  ansible.builtin.include_tasks: prepare_hosts.yml

- name: Configure Etcd
  ansible.builtin.include_tasks: etcd.yml

- name: Wait for etcd cluster health
  ansible.builtin.command: |
    etcdctl \
      --endpoints=https://127.0.0.1:2379 \
      --cacert={{ patroni_etcd_ssl }}/ca.crt \
      --cert={{ patroni_etcd_ssl }}/etcd-{{ inventory_hostname }}.crt \
      --key={{ patroni_etcd_ssl }}/etcd-{{ inventory_hostname }}.key \
      endpoint health \
      --cluster
  register: patroni_etcd_health
  until: patroni_etcd_health.rc == 0
  retries: 12
  delay: 5
  changed_when: false
  run_once: true

- name: Configure Patroni cluster
  ansible.builtin.include_tasks: patroni.yml

- name: Check cluster status
  ansible.builtin.include_tasks: check_status.yml
