---

- name: Wipe postgres data and WAL archive
  when: patroni_wipe_existing_cluster | bool
  block:
    - name: Ensure volume verification helper is installed
      ansible.builtin.copy:
        src: patroni-require-volume
        dest: /usr/local/sbin/patroni-require-volume
        owner: root
        group: root
        mode: '0755'

    - name: Verify data volumes before destructive wipe
      ansible.builtin.command:
        argv:
          - /usr/local/sbin/patroni-require-volume
          - "{{ item.path }}"
          - "/dev/mapper/patroni-{{ item.name }}"
      changed_when: false
      loop: "{{ patroni_data_volumes }}"
      loop_control:
        label: >-
          {{ item.path }} <- /dev/mapper/patroni-{{ item.name }}

    - name: Stop Patroni before wiping
      ansible.builtin.systemd_service:
        name: percona-patroni
        state: stopped
      failed_when: false
    - name: Check for existing Patroni config
      ansible.builtin.stat:
        path: "{{ patroni_patroni_config_yaml }}"
      register: patroni_config
      run_once: true

    - name: Remove cluster from DCS
      ansible.builtin.command: patronictl -c {{ patroni_patroni_config_yaml }} remove {{ patroni_cluster_name }}
      args:
        stdin: "{{ patroni_cluster_name }}\nYes I am aware"
      register: patroni_remove
      failed_when: false
      changed_when: patroni_remove.rc == 0
      run_once: true
      when: patroni_config.stat.exists

    - name: Remove postgres data and WAL
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - "{{ patroni_postgres_data_dir }}/"
        - "{{ patroni_pgbackup_path }}/"

    - name: Stop etcd before wiping
      ansible.builtin.systemd_service:
        name: etcd
        state: stopped
      failed_when: false

    - name: Unmount etcd data volume
      ansible.posix.mount:
        path: "{{ patroni_etcd_data_dir }}"
        state: unmounted

    - name: Remove etcd data directory
      ansible.builtin.file:
        path: "{{ patroni_etcd_data_dir }}"
        state: absent
