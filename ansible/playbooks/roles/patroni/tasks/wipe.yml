---

- name: Wipe postgres data and WAL archive
  when: patroni_wipe_existing_cluster | bool
  block:
    - name: Ensure volume verification helper is installed
      ansible.builtin.copy:
        src: patroni-require-volume
        dest: /usr/local/sbin/patroni-require-volume
        owner: root
        group: root
        mode: '0755'

    - name: Verify data volumes before destructive wipe
      ansible.builtin.command:
        argv:
          - /usr/local/sbin/patroni-require-volume
          - "{{ item.path }}"
          - "/dev/mapper/patroni-{{ item.name }}"
      changed_when: false
      loop: "{{ patroni_data_volumes }}"
      loop_control:
        label: >-
          {{ item.path }} <- /dev/mapper/patroni-{{ item.name }}

    - name: Check for existing Patroni config
      ansible.builtin.stat:
        path: "{{ patroni_patroni_config_yaml }}"
      register: patroni_config
      run_once: true

    - name: Read cluster state
      ansible.builtin.uri:
        url: "https://{{ ansible_host }}:8008/cluster"
        method: GET
        return_content: true
        client_cert: "{{ patroni_patroni_ssl }}/patroni-{{ inventory_hostname }}.crt"
        client_key: "{{ patroni_patroni_ssl }}/patroni-{{ inventory_hostname }}.key"
        ca_path: "{{ patroni_ca_cert_dir }}/ca.crt"
      register: patroni_cluster_state
      changed_when: false
      failed_when: false
      run_once: true
      when: patroni_config.stat.exists

    - name: Find the current leader
      ansible.builtin.set_fact:
        patroni_dcs_leader: >-
          {{ patroni_cluster_state.json.members
            | default([])
            | selectattr('role', 'in', ['leader', 'standby_leader'])
            | map(attribute='name')
            | first | default('') }}
      run_once: true

    - name: Stop Patroni before wiping
      ansible.builtin.systemd_service:
        name: percona-patroni
        state: stopped
      failed_when: false

    - name: Remove cluster from DCS
      ansible.builtin.command: patronictl -c {{ patroni_patroni_config_yaml }} remove {{ patroni_cluster_name }}
      args:
        stdin: "{{ patroni_cluster_name }}\nYes I am aware\n{{ patroni_dcs_leader }}"
      register: patroni_remove
      failed_when: false
      changed_when: patroni_remove.rc == 0
      run_once: true
      when: patroni_config.stat.exists

    - name: Remove postgres data and WAL
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - "{{ patroni_postgres_data_dir }}/"
        - "{{ patroni_pgbackup_path }}/"

    - name: Stop etcd before wiping
      ansible.builtin.systemd_service:
        name: etcd
        state: stopped
      failed_when: false

    - name: Unmount etcd data volume
      ansible.posix.mount:
        path: "{{ patroni_etcd_data_dir }}"
        state: unmounted

    - name: Remove etcd data directory
      ansible.builtin.file:
        path: "{{ patroni_etcd_data_dir }}"
        state: absent
