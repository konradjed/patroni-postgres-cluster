---
- name: Prepare Patroni cluster
  hosts: psql
  become: true
  any_errors_fatal: true
  roles:
    - role: patroni_create

  post_tasks:
    - name: Are you leader
      ansible.builtin.command: /usr/local/lib/patroni/leader-gate
      register: patroni_playbook_leader
      changed_when: false
      failed_when: patroni_playbook_leader.rc == 2

    - name: Create example database
      when: patroni_playbook_leader.rc == 0
      block:

        - name: Copy SQL file
          ansible.builtin.template:
            src: appdb.sql.j2
            dest: /var/lib/pgsql/appdb.sql
            owner: postgres
            group: postgres
            mode: '0600'
          no_log: true

        - name: Load SQL file using application password from OpenBao
          ansible.builtin.shell: |
            set -euo pipefail

            export PATRONI_APP_PASSWORD

            PATRONI_APP_PASSWORD="$(
              /usr/local/libexec/patroni/bao-read \
                {{ patroni_create_bao_app_user_password_path | quote }} \
                password
            )"

            if [[ -z "$PATRONI_APP_PASSWORD" ]]; then
              echo "Application user password received from OpenBao is empty" >&2
              exit 1
            fi

            exec /usr/pgsql-18/bin/psql \
              --no-psqlrc \
              --set=ON_ERROR_STOP=1 \
              --file=/var/lib/pgsql/appdb.sql
          args:
            executable: /bin/bash
          become_user: postgres
          changed_when: true
          diff: false
          no_log: true
