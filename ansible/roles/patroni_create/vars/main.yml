# SPDX-License-Identifier: MIT-0
---
# vars file for patroni
# Postgres directories
patroni_create_vars_postgres_main_dir: /var/lib/percona-pgsql
patroni_create_vars_pgbackup_wal_path: "{{ patroni_create_vars_postgres_main_dir }}/archived"
patroni_create_vars_postgres_data_dir: "{{ patroni_create_vars_postgres_main_dir }}/18/data"
patroni_create_vars_postgres_ssl: "{{ patroni_create_vars_postgres_main_dir }}/18/ssl"
patroni_create_vars_postgres_socket: /var/run/postgresql
patroni_create_vars_postgres_bin: /usr/pgsql-18/bin
# etcd directories
patroni_create_vars_etcd_config_dir: /etc/etcd
patroni_create_vars_etcd_ssl: "{{ patroni_create_vars_etcd_config_dir }}/ssl"
patroni_create_vars_etcd_data_dir: /var/lib/etcd
# Patroni directories
patroni_create_vars_patroni_config_dir: /etc/patroni
patroni_create_vars_patroni_config_yaml: "{{ patroni_create_vars_patroni_config_dir }}/patroni.yml"
patroni_create_vars_patroni_ssl: "{{ patroni_create_vars_patroni_config_dir }}/ssl"
patroni_create_vars_patroni_dcs_client: "{{ patroni_create_vars_patroni_config_dir }}/dcs-client"
patroni_create_vars_patroni_bin: /usr/bin/patroni
patroni_create_vars_patroni_restart_svc_type: 'on-failure'
# pgBackRest directories
patroni_create_vars_pgbackrest_data_dir: /var/lib/pgbackrest
patroni_create_vars_pgbackrest_log_dir: /var/log/pgbackrest
# pgBackRest configuration directories
patroni_create_vars_pgback_dumps_dir: "{{ patroni_create_vars_postgres_main_dir }}/pg_back/dumps"
patroni_create_vars_pgback_config_dir: "/etc/pg_back"
# Alloy configuration directories
patroni_create_vars_alloy_config_dir: /etc/alloy
