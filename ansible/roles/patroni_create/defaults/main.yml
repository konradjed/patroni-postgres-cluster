---
# defaults file for patroni

# run config settings
patroni_create_inventory_group: psql


# Firewall settings
patroni_create_app_cidrs: []
patroni_create_management_cidr: ""
patroni_create_firewall_zone: patroni
patroni_create_firewall_ports:
  - 2379
  - 2380
  - 5432
  - 8008


# LUKS volumes settings
patroni_create_volume_fstype: xfs
patroni_create_data_volumes:
  - name: pgdata
    device:              # device id
    path: /var/lib/pgsql
    gib: 10
    owner: postgres
  - name: etcd
    device:              # device id
    path: /var/lib/etcd
    gib: 5
    owner: etcd


# Patroni settings
patroni_create_pg_token: PostgreSQL_HA_Cluster
patroni_create_cluster_name: pg_cluster
patroni_create_patroni_ttl: 30
patroni_create_patroni_loop_wait: 10
patroni_create_patroni_retry_timeout: 10
patroni_create_patroni_primary_start_timeout: 0
patroni_create_patroni_maximum_lag_on_failover: 1048576
patroni_create_patroni_check_timeline: true
patroni_create_patroni_synchronous_mode: quorum
patroni_create_patroni_synchronous_node_count: 1
patroni_create_patroni_synchronous_mode_strict: true


# Etcd settings
patroni_create_etcd_auto_compaction_retention: 10h
patroni_create_etcd_quota_backend_bytes: 2147483648
patroni_create_etcd_snapshot_count: 100000
patroni_create_etcd_heartbeat_interval: 100
patroni_create_etcd_election_timeout: 1000


# Postgres settings
patroni_create_postgres_wal_keep_size: 160MB
patroni_create_postgres_max_wal_senders: 5
patroni_create_postgres_max_replication_slots: 10
patroni_create_postgres_max_wal_size: 10GB
patroni_create_postgres_archive_timeout: 60s

patroni_create_app_db_name: app


# Watchdog settings
patroni_create_watchdog_mode: required
patroni_create_watchdog_device: /dev/watchdog
patroni_create_watchdog_safety_margin: 5


# S3 Storage settings
patroni_create_s3_bucket_name: patroni-bucket
patroni_create_s3_endpoint: 192.168.172.140
patroni_create_s3_port: 9000
patroni_create_s3_region: eu-central-1
patroni_create_s3_backup_prefix: /pgbackrest
patroni_create_s3_dump_prefix: pgdump


# PgBackRest and dumps timers settings
patroni_create_on_boot_full_backup: 3min
patroni_create_interval_full_backup: 30min

patroni_create_on_boot_incr_backup: 5min
patroni_create_interval_incr_backup: 2min

patroni_create_on_boot_dump: 7min
patroni_create_interval_dump: 15min


# Dump settings
patroni_create_dump_retention: 3
patroni_create_dump_retention_days: 7


# pgbackrest settings
patroni_create_pgbackrest_retention_full: 2
patroni_create_pgbackrest_process_max: 2
patroni_create_pgbackrest_start_fast: true
patroni_create_pgbackrest_log_level_console: info
patroni_create_pgbackrest_log_level_file: detail
patroni_create_pgbackrest_archive_timeout: 60


# Openbao settings
patroni_create_bao_secret_namespace: patroni
patroni_create_bao_auth_path: patroni-cert
patroni_create_bao_address: https://192.168.172.160:8200
patroni_create_bao_token_path: /run/openbao-agent/token
patroni_create_bao_secrets_mount: patroni-secrets
patroni_create_bao_cluster_path: pg-cluster
patroni_create_bao_token_wait_timeout: 120
patroni_create_bao_postgres_password_path: "{{ patroni_create_bao_cluster_path }}/shared/postgresql/postgres"
patroni_create_bao_replicator_password_path: "{{ patroni_create_bao_cluster_path }}/shared/postgresql/replicator"
patroni_create_bao_app_user_password_path: "{{ patroni_create_bao_cluster_path }}/shared/postgresql/app"
patroni_create_bao_pgbackrest_path: "{{ patroni_create_bao_cluster_path }}/shared/pgbackrest"
patroni_create_bao_pgdump_path: "{{ patroni_create_bao_cluster_path }}/shared/pgdump"
patroni_create_bao_s3_path: "{{ patroni_create_bao_cluster_path }}/shared/s3"


# Pg-tde settings
patroni_create_pg_tde_provider_name: openbao-patroni
patroni_create_pg_tde_mount_path: pg-tde
patroni_create_pg_tde_key_name: pg-cluster-default-key-v1


# Alloy settings
patroni_create_enable_alloy: true
patroni_create_enable_alloy_ui: false
patroni_create_alloy_logging_level: info
patroni_create_alloy_include_exporter_metrics: true
patroni_create_alloy_scrape_interval: 15s
patroni_create_alloy_remote_write_url:


patroni_create_recovery_mode: false
# Set only one recovery target below. If both values are set,
# patroni_create_recovery_backup_id takes precedence.
patroni_create_recovery_backup_id:
patroni_create_recovery_date:    # Format: "YYYY-MM-DD HH:MM:SS[+HH]", timezone offset recommended
patroni_create_recovery_node: pg1
patroni_create_recovery_db_checks: [] # Optional: list of databases to verify after recovery - empty skips the check.
# Optional - expected default pg_tde key name during recovery, falls back to patroni_create_pg_tde_key_name when empty.
patroni_create_recovery_pg_tde_default_key:


# ==============================================================================
# !!! DANGER !!! DESTRUCTIVE AND IRREVERSIBLE CLUSTER RECREATION !!! DANGER !!!
# ==============================================================================
# Set to true ONLY after the decision has been reviewed and agreed with the
# application and database owners, the application is not required to remain
# available, and there is an explicit need to destroy and rebuild the cluster.
#
# TRUE REMOVES POSTGRESQL DATA, THE LOCAL WAL ARCHIVE, AND THE COMPLETE LOCAL
# ETCD/DCS STATE ON EVERY SELECTED HOST. ALWAYS TARGET THE FULL CLUSTER.
# ==============================================================================
patroni_create_wipe_existing_cluster: false
# ==============================================================================
