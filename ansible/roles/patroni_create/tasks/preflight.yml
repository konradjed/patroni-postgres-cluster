---

- name: Verify supported operating system
  ansible.builtin.assert:
    that:
      - ansible_facts['distribution'] == 'Rocky'
      - ansible_facts['distribution_major_version'] == '9'
      - ansible_facts['service_mgr'] == 'systemd'
    fail_msg: >-
      Unsupported system.
      This role requires Rocky Linux 9 with systemd.
    success_msg: "Supported system: Rocky Linux 9 with systemd."

- name: Verify data volume definitions
  ansible.builtin.assert:
    that:
      - item.name | default('', true) | length > 0
      - item.device | default('', true) | length > 0
      - item.path | default('', true) | length > 0
      - item.gib | int > 0
      - item.owner | default('', true) | length > 0
    fail_msg: "Invalid data volume definition: {{ item }}"
  loop: "{{ patroni_create_data_volumes }}"
  loop_control:
    label: "{{ item.name | default('<unnamed>', true) }}"

- name: Verify unique data volume definitions
  ansible.builtin.assert:
    that:
      - patroni_create_data_volumes | length > 0
      - >-
        patroni_create_data_volumes | map(attribute='name') | unique | length
        == patroni_create_data_volumes | length
      - >-
        patroni_create_data_volumes | map(attribute='device') | unique | length
        == patroni_create_data_volumes | length
      - >-
        patroni_create_data_volumes | map(attribute='path') | unique | length
        == patroni_create_data_volumes | length
    fail_msg: >-
      Data volume names, devices and mount paths must be unique.

- name: Verify required PostgreSQL and etcd volumes
  ansible.builtin.assert:
    that:
      - >-
        patroni_create_data_volumes
        | selectattr('path', 'equalto', patroni_create_vars_postgres_main_dir)
        | list | length == 1
      - >-
        patroni_create_data_volumes
        | selectattr('path', 'equalto', patroni_create_vars_etcd_data_dir)
        | list | length == 1
      - >-
        patroni_create_data_volumes
        | selectattr('path', 'equalto', patroni_create_vars_postgres_main_dir)
        | selectattr('owner', 'equalto', 'postgres')
        | list | length == 1
      - >-
        patroni_create_data_volumes
        | selectattr('path', 'equalto', patroni_create_vars_etcd_data_dir)
        | selectattr('owner', 'equalto', 'etcd')
        | list | length == 1
    fail_msg: >-
      Exactly one PostgreSQL volume owned by postgres and one etcd volume
      owned by etcd must be configured.
