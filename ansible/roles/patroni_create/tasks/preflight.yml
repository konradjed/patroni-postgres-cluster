---

- name: Verify supported operating system
  ansible.builtin.assert:
    that:
      - ansible_facts['distribution'] == 'Rocky'
      - ansible_facts['distribution_major_version'] == '9'
      - ansible_facts['service_mgr'] == 'systemd'
    fail_msg: >-
      Unsupported system.
      This role requires Rocky Linux 9 with systemd.
    success_msg: "Supported system: Rocky Linux 9 with systemd."

- name: Verify data volume definitions
  ansible.builtin.assert:
    that:
      - item.name | default('', true) | length > 0
      - item.device | default('', true) | length > 0
      - item.path | default('', true) | length > 0
      - item.gib | int > 0
      - item.owner | default('', true) | length > 0
    fail_msg: "Invalid data volume definition: {{ item }}"
  loop: "{{ patroni_create_data_volumes }}"
  loop_control:
    label: "{{ item.name | default('<unnamed>', true) }}"

- name: Verify unique data volume definitions
  ansible.builtin.assert:
    that:
      - patroni_create_data_volumes | length > 0
      - >-
        patroni_create_data_volumes | map(attribute='name') | unique | length
        == patroni_create_data_volumes | length
      - >-
        patroni_create_data_volumes | map(attribute='device') | unique | length
        == patroni_create_data_volumes | length
      - >-
        patroni_create_data_volumes | map(attribute='path') | unique | length
        == patroni_create_data_volumes | length
    fail_msg: >-
      Data volume names, devices and mount paths must be unique.

- name: Verify required PostgreSQL and etcd volumes
  ansible.builtin.assert:
    that:
      - >-
        patroni_create_data_volumes
        | selectattr('path', 'equalto', patroni_create_vars_postgres_main_dir)
        | list | length == 1
      - >-
        patroni_create_data_volumes
        | selectattr('path', 'equalto', patroni_create_vars_etcd_data_dir)
        | list | length == 1
      - >-
        patroni_create_data_volumes
        | selectattr('path', 'equalto', patroni_create_vars_postgres_main_dir)
        | selectattr('owner', 'equalto', 'postgres')
        | list | length == 1
      - >-
        patroni_create_data_volumes
        | selectattr('path', 'equalto', patroni_create_vars_etcd_data_dir)
        | selectattr('owner', 'equalto', 'etcd')
        | list | length == 1
    fail_msg: >-
      Exactly one PostgreSQL volume owned by postgres and one etcd volume
      owned by etcd must be configured.

- name: Verify required secret variables are non-empty
  ansible.builtin.assert:
    that:
      - patroni_create_postgres_user_pass | default('', true) | string | trim | length > 0
      - patroni_create_replicator_user_pass | default('', true) | string | trim | length > 0
      - patroni_create_app_user_pass | default('', true) | string | trim | length > 0
      - patroni_create_s3_access_key | default('', true) | string | trim | length > 0
      - patroni_create_s3_secret | default('', true) | string | trim | length > 0
    fail_msg: >-
      A required secret variable is undefined, empty, or contains only whitespace.
      Check the failed assertion and provide the value through Ansible Vault.
    success_msg: "All checked secret variables are set and non-empty."

- name: Check dump encrytpion is set
  when: patroni_create_dump_encryption | bool
  ansible.builtin.assert:
    that:
      - patroni_create_dump_encryption_public_key | default('', true) | string | trim | length > 0
    fail_msg: >-
      You turned on the encryption opt for dump, but didn't set encryption key.
      Please set patroni_create_dump_encryption_public_key using Ansible Vault

- name: Check backup encrytpion is set
  when: patroni_create_pgbackrest_encryption | bool
  ansible.builtin.assert:
    that:
      - patroni_create_pgbackrest_encryption_cipher_pass | default('', true) | string | trim | length > 0
    fail_msg: >-
      You turned on the encryption opt for backup, but didn't set encryption key.
      Please set patroni_create_pgbackrest_encryption_cipher_pass using Ansible Vault

- name: Recovery preflight
  when: patroni_create_recovery_mode | bool
  block:
    - name: Check required vars
      ansible.builtin.assert:
        that:
          - (patroni_create_recovery_backup_id | default('', true) | string | trim | length > 0)
            or (patroni_create_recovery_date | default('', true) | string | trim | length > 0)
        fail_msg: >-
          Please set a backup ID or recovery date
        success_msg: Correct

    - name: Verify recovery date format
      when: patroni_create_recovery_backup_id | default('', true) | string | trim | length == 0
      ansible.builtin.assert:
        that:
          - >-
            patroni_create_recovery_date | default('', true) | string | trim
            is match('^\d{4}-(0[1-9]|1[0-2])-(0[1-9]|[12]\d|3[01]) ([01]\d|2[0-3]):[0-5]\d:[0-5]\d(\+(0\d|1\d|2[0-3]))?$')
        fail_msg: >-
          patroni_create_recovery_date must use the format
          YYYY-MM-DD HH:MM:SS[+HH], for example 2026-10-14 17:14:00+02.
        success_msg: Recovery date format is valid.

    - name: Check recovery node
      ansible.builtin.assert:
        that:
          - patroni_create_recovery_node | default('', true) | string | trim | length > 0
          - patroni_create_recovery_node in groups[patroni_create_inventory_group]
        fail_msg: >-
          patroni_create_recovery_node must identify one member of
          {{ patroni_create_inventory_group }}.
      run_once: true

    - name: Define recovery point
      ansible.builtin.set_fact:
        patroni_playbook_recovery_point: >-
          {{ patroni_create_recovery_backup_id if patroni_create_recovery_backup_id
            | default('', true)
            | string
            | trim
            | length > 0 else patroni_create_recovery_date
          }}
        patroni_playbook_recovery_type: >-
          {{ "backup" if patroni_create_recovery_backup_id
            | default('', true)
            | string
            | trim
            | length > 0 else "date"
          }}

    - name: Verify existence of stanza
      when: patroni_create_wipe_existing_cluster | bool
      ansible.builtin.command:
        argv:
          - /usr/bin/pgbackrest
          - --stanza={{ patroni_create_cluster_name }}
          - info
      become_user: postgres
      changed_when: false
      run_once: true
      delegate_to: "{{ patroni_create_recovery_node }}"
      register: patroni_playbook_recovery_stanza_info
      failed_when: >-
        patroni_playbook_recovery_stanza_info.rc != 0 or
        'status: error' in patroni_playbook_recovery_stanza_info.stdout

    - name: Verify existence of backup
      when:
        - patroni_playbook_recovery_type == "backup"
        - patroni_create_wipe_existing_cluster | bool
      ansible.builtin.command:
        argv:
          - /usr/bin/pgbackrest
          - --stanza={{ patroni_create_cluster_name }}
          - --set={{ patroni_playbook_recovery_point }}
          - info
      become_user: postgres
      changed_when: false
      run_once: true
      delegate_to: "{{ patroni_create_recovery_node }}"
      register: patroni_playbook_recovery_backup_info
      failed_when: >-
        patroni_playbook_recovery_backup_info.rc != 0 or
        'status: error' in patroni_playbook_recovery_backup_info.stdout
