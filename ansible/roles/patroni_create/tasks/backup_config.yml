---

- name: Ensure required directories exist and have right permissions
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: postgres
    group: postgres
    mode: '0750'
  loop:
    - /etc/pgbackrest
    - "{{ patroni_create_vars_pgbackrest_data_dir }}"
    - "{{ patroni_create_vars_pgbackrest_log_dir }}"
    - "{{ patroni_create_vars_pgback_dumps_dir }}"
    - "{{ patroni_create_vars_pgback_config_dir }}"

- name: Backup pgBackRest configuration
  ansible.builtin.copy:
    src: /etc/pgbackrest.conf
    dest: /etc/pgbackrest/pgbackrest.conf.bak
    remote_src: true
    owner: root
    group: root
    mode: preserve
    force: false

- name: Copy pgbackrest config file
  ansible.builtin.template:
    src: config-files/pgbackrest.conf.j2
    dest: /etc/pgbackrest/pgbackrest.conf
    owner: postgres
    group: postgres
    mode: '0600'
  no_log: true
  diff: false

- name: Create patroni backup bin folder
  ansible.builtin.file:
    path: "/usr/local/lib/patroni"
    state: directory
    owner: root
    group: root
    mode: '0755'

- name: Copy pg_back config file
  ansible.builtin.template:
    src: config-files/pg_back.conf.j2
    dest: "{{ patroni_create_vars_pgback_config_dir }}/pg_back.conf"
    owner: postgres
    group: postgres
    mode: '0600'
  no_log: true
  diff: false

- name: Copy backup bin files
  ansible.builtin.template:
    src: "pgbackrest-bins/{{ item }}.j2"
    dest: "/usr/local/lib/patroni/{{ item }}"
    owner: root
    group: root
    mode: '0755'
  loop:
    - run-pgbackrest
    - run-dump
    - leader-gate

- name: Load timers to systemd
  ansible.builtin.template:
    src: "systemd/{{ item }}.j2"
    dest: "/etc/systemd/system/{{ item }}"
    owner: root
    group: root
    mode: "0644"
  loop:
    - patroni-backup@.service
    - patroni-pgdump.service
    - patroni-pgdump.timer
    - patroni-full-backup.timer
    - patroni-incre-backup.timer
  notify: Reload systemd

- name: Apply pending handlers before continuing
  ansible.builtin.meta: flush_handlers
