---

- name: Start percona-patroni
  ansible.builtin.systemd_service:
    name: percona-patroni
    state: started
    enabled: true

- name: Check leadership before creating the stanza
  ansible.builtin.command: /usr/local/lib/patroni/leader-gate
  register: patroni_playbook_stanza_gate
  changed_when: false
  failed_when: false
  until: patroni_playbook_stanza_gate.rc != 2
  retries: 60
  delay: 2

- name: Create stanza
  ansible.builtin.command: >-
    /usr/bin/pgbackrest --stanza={{ patroni_create_cluster_name }} --no-online stanza-create
  become_user: postgres
  changed_when: false
  when: patroni_playbook_stanza_gate.rc == 0

- name: Check the repository
  ansible.builtin.command: >-
    /usr/bin/pgbackrest --stanza={{ patroni_create_cluster_name }} check
  become_user: postgres
  changed_when: false
  when: patroni_playbook_stanza_gate.rc == 0
