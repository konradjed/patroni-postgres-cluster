---

- name: Inspect configured data devices
  ansible.builtin.stat:
    path: "{{ item.device }}"
    follow: true
  register: patroni_volume_device_stats
  loop: "{{ patroni_data_volumes }}"
  loop_control:
    label: "{{ item.name }} -> {{ item.device }}"

- name: Verify configured data devices exist and are block devices
  ansible.builtin.assert:
    that:
      - item.stat.exists
      - item.stat.isblk
    fail_msg: >-
      {{ item.item.device | default('<undefined>') }} configured for
      {{ item.item.name }} does not exist or is not a block device.
  loop: "{{ patroni_volume_device_stats.results }}"
  loop_control:
    label: "{{ item.item.name }}"

- name: Read configured device type and size
  ansible.builtin.command:
    argv:
      - lsblk
      - --bytes
      - --nodeps
      - --noheadings
      - --output
      - TYPE,SIZE
      - "{{ item.device }}"
  register: patroni_volume_device_properties
  changed_when: false
  loop: "{{ patroni_data_volumes }}"
  loop_control:
    label: "{{ item.name }} -> {{ item.device }}"

- name: Verify each device is a whole disk of the declared size
  ansible.builtin.assert:
    that:
      - item.stdout.split() | length == 2
      - item.stdout.split()[0] == 'disk'
      - (item.stdout.split()[1] | int) >= ((item.item.gib | int) * 1073741824 * 0.98)
      - (item.stdout.split()[1] | int) <= ((item.item.gib | int) * 1073741824 * 1.02)
    fail_msg: >-
      {{ item.item.device }} is not a whole disk of approximately
      {{ item.item.gib }} GiB (got: {{ item.stdout }}).
  loop: "{{ patroni_volume_device_properties.results }}"
  loop_control:
    label: "{{ item.item.name }}"

- name: Build the volume map
  ansible.builtin.set_fact:
    patroni_volumes: >-
      {{ patroni_volumes | default([]) + [item | combine({
           'mapper': 'patroni-' ~ item.name,
           'keyfile': patroni_luks_key_dir ~ '/' ~ item.name ~ '.key'
         })] }}
  loop: "{{ patroni_data_volumes }}"
  loop_control:
    label: "{{ item.name }} -> {{ item.device }}"

- name: Create the configuration directory
  ansible.builtin.file:
    path: "{{ patroni_luks_key_dir | dirname }}"
    state: directory
    owner: root
    group: root
    mode: '0755'

- name: Create the LUKS key directory
  ansible.builtin.file:
    path: "{{ patroni_luks_key_dir }}"
    state: directory
    owner: root
    group: root
    mode: '0700'

- name: Check whether configured devices already contain LUKS
  ansible.builtin.command:
    argv:
      - cryptsetup
      - isLuks
      - "{{ item.device }}"
  register: patroni_existing_luks
  changed_when: false
  failed_when: patroni_existing_luks.rc not in [0, 1]
  loop: "{{ patroni_volumes }}"
  loop_control:
    label: "{{ item.name }} -> {{ item.device }}"

- name: Require explicit recreation for existing encrypted volumes
  ansible.builtin.assert:
    that:
      - item.rc != 0 or (patroni_wipe_existing_cluster | bool)
    fail_msg: >-
      {{ item.item.device }} already contains a LUKS volume.
      Refusing to reformat it while patroni_wipe_existing_cluster is false.
      Use the explicit recreation mode if this cluster must be destroyed.
  loop: "{{ patroni_existing_luks.results }}"
  loop_control:
    label: "{{ item.item.name }}"

- name: Unmount data volumes before recreating encryption
  ansible.posix.mount:
    path: "{{ item.path }}"
    state: unmounted
  loop: "{{ patroni_volumes }}"
  loop_control:
    label: "{{ item.path }}"

- name: Create/Recreate encrypted data volumes
  ansible.builtin.shell: |
    set -euo pipefail

    device="{{ item.device }}"
    mapper="{{ item.mapper }}"
    keyfile="{{ item.keyfile }}"
    new_keyfile="${keyfile}.new"

    if [ -e "/dev/mapper/$mapper" ]; then
      cryptsetup close "$mapper"
    fi

    if [ ! -s "$new_keyfile" ]; then
      umask 077
      head -c 512 /dev/urandom > "$new_keyfile"
      chmod 0400 "$new_keyfile"
    fi

    wipefs --all "$device"

    cryptsetup luksFormat \
      --type luks2 \
      --batch-mode \
      --key-file "$new_keyfile" \
      "$device"

    mv --force "$new_keyfile" "$keyfile"
    chmod 0400 "$keyfile"

    cryptsetup luksOpen \
      --key-file "$keyfile" \
      "$device" \
      "$mapper"

    mkfs.{{ patroni_volume_fstype }} \
      -q \
      -f \
      "/dev/mapper/$mapper"

    echo changed
  args:
    executable: /bin/bash
  register: patroni_volume_recreation
  changed_when: "'changed' in patroni_volume_recreation.stdout"
  loop: "{{ patroni_volumes }}"
  loop_control:
    label: "{{ item.name }} on {{ item.device }}"

- name: Read each volume's LUKS UUID
  ansible.builtin.command: "cryptsetup luksUUID {{ item.device }}"
  register: patroni_luks_uuids
  changed_when: false
  loop: "{{ patroni_volumes }}"
  loop_control:
    label: "{{ item.name }}"

- name: Configure unattended unlock at boot
  ansible.builtin.template:
    src: crypttab.j2
    dest: /etc/crypttab
    owner: root
    group: root
    mode: '0600'
  vars:
    patroni_crypttab_entries: "{{ patroni_volumes | zip(patroni_luks_uuids.results | map(attribute='stdout') | list) | list }}"

- name: Install the mount guard used by the service units
  ansible.builtin.copy:
    src: patroni-require-volume
    dest: /usr/local/sbin/patroni-require-volume
    owner: root
    group: root
    mode: '0755'

- name: Mount each data volume and persist it in fstab
  ansible.posix.mount:
    path: "{{ item.path }}"
    src: "/dev/mapper/{{ item.mapper }}"
    fstype: "{{ patroni_volume_fstype }}"
    opts: defaults
    state: mounted
  loop: "{{ patroni_volumes }}"
  loop_control:
    label: "{{ item.path }} <- /dev/mapper/{{ item.mapper }}"

- name: Set ownership of each mounted volume
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: "{{ item.owner }}"
    group: "{{ item.owner }}"
    mode: '0700'
  loop: "{{ patroni_volumes }}"
  loop_control:
    label: "{{ item.path }}"
