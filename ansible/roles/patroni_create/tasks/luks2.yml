---

- name: Inspect configured data devices
  ansible.builtin.stat:
    path: "{{ item.device }}"
    follow: true
  register: patroni_playbook_volume_device_stats
  loop: "{{ patroni_create_data_volumes }}"
  loop_control:
    label: "{{ item.name }} -> {{ item.device }}"

- name: Verify configured data devices exist and are block devices
  ansible.builtin.assert:
    that:
      - item.stat.exists
      - item.stat.isblk
    fail_msg: >-
      {{ item.item.device | default('<undefined>') }} configured for
      {{ item.item.name }} does not exist or is not a block device.
  loop: "{{ patroni_playbook_volume_device_stats.results }}"
  loop_control:
    label: "{{ item.item.name }}"

- name: Read configured device type and size
  ansible.builtin.command:
    argv:
      - lsblk
      - --bytes
      - --nodeps
      - --noheadings
      - --output
      - TYPE,SIZE
      - "{{ item.device }}"
  register: patroni_playbook_volume_device_properties
  changed_when: false
  loop: "{{ patroni_create_data_volumes }}"
  loop_control:
    label: "{{ item.name }} -> {{ item.device }}"

- name: Verify each device is a whole disk of the declared size
  ansible.builtin.assert:
    that:
      - item.stdout.split() | length == 2
      - item.stdout.split()[0] == 'disk'
      - (item.stdout.split()[1] | int) >= ((item.item.gib | int) * 1073741824 * 0.98)
      - (item.stdout.split()[1] | int) <= ((item.item.gib | int) * 1073741824 * 1.02)
    fail_msg: >-
      {{ item.item.device }} is not a whole disk of approximately
      {{ item.item.gib }} GiB (got: {{ item.stdout }}).
  loop: "{{ patroni_playbook_volume_device_properties.results }}"
  loop_control:
    label: "{{ item.item.name }}"

- name: Build the volume map
  ansible.builtin.set_fact:
    patroni_playbook_volumes: >-
      {{ patroni_playbook_volumes | default([]) + [item | combine({
           'mapper': 'patroni-' ~ item.name,
           'secret_path': patroni_create_bao_cluster_path ~ '/nodes/' ~ inventory_hostname ~ '/luks/' ~ item.name
         })] }}
  loop: "{{ patroni_create_data_volumes }}"
  loop_control:
    label: "{{ item.name }} -> {{ item.device }}"

- name: Verify access to every configured LUKS key in OpenBao
  ansible.builtin.shell: |
    set -euo pipefail

    decoded_size="$({{ '/usr/local/libexec/patroni/bao-read' | quote }} \
      {{ item.secret_path | quote }} \
      key_b64 | base64 --decode | wc -c)"
    test "$decoded_size" -gt 0
  args:
    executable: /bin/bash
  loop: "{{ patroni_playbook_volumes }}"
  loop_control:
    label: "{{ item.secret_path }}"
  changed_when: false
  no_log: true

- name: Check whether configured devices already contain LUKS
  ansible.builtin.command:
    argv:
      - cryptsetup
      - isLuks
      - "{{ item.device }}"
  register: patroni_playbook_existing_luks
  changed_when: false
  failed_when: patroni_playbook_existing_luks.rc not in [0, 1]
  loop: "{{ patroni_playbook_volumes }}"
  loop_control:
    label: "{{ item.name }} -> {{ item.device }}"

- name: Unmount data volumes before recreating encryption
  ansible.posix.mount:
    path: "{{ item.item.path }}"
    state: unmounted
  loop: "{{ patroni_playbook_existing_luks.results }}"
  loop_control:
    label: "{{ item.item.path }}"
  when: item.rc == 1 or (patroni_create_wipe_existing_cluster | bool)

- name: Create or recreate encrypted data volumes using OpenBao keys
  ansible.builtin.shell: |
    set -euo pipefail

    device={{ item.item.device | quote }}
    mapper={{ item.item.mapper | quote }}

    if cryptsetup status "$mapper" >/dev/null 2>&1; then
      cryptsetup close "$mapper"
    fi

    wipefs --all "$device"

    /usr/local/libexec/patroni/bao-read \
      {{ item.item.secret_path | quote }} \
      key_b64 | \
    base64 --decode | \
    cryptsetup luksFormat \
      --type luks2 \
      --batch-mode \
      --key-file=- \
      "$device"
  args:
    executable: /bin/bash
  register: patroni_playbook_volume_recreation
  changed_when: true
  loop: "{{ patroni_playbook_existing_luks.results }}"
  loop_control:
    label: "{{ item.item.name }} on {{ item.item.device }}"
  when: item.rc == 1 or (patroni_create_wipe_existing_cluster | bool)
  no_log: true

- name: Open encrypted data volumes using OpenBao keys
  ansible.builtin.shell: |
    set -euo pipefail

    if cryptsetup status {{ item.mapper | quote }} >/dev/null 2>&1; then
      exit 0
    fi

    /usr/local/libexec/patroni/bao-read \
      {{ item.secret_path | quote }} \
      key_b64 | \
    base64 --decode | \
    cryptsetup luksOpen \
      --key-file=- \
      {{ item.device | quote }} \
      {{ item.mapper | quote }}

    echo opened
  args:
    executable: /bin/bash
  register: patroni_playbook_volume_open
  changed_when: "'opened' in patroni_playbook_volume_open.stdout"
  loop: "{{ patroni_playbook_volumes }}"
  loop_control:
    label: "{{ item.name }} on {{ item.device }}"
  no_log: true

- name: Create filesystems on newly encrypted data volumes
  ansible.builtin.command:
    argv:
      - "mkfs.{{ patroni_create_volume_fstype }}"
      - -q
      - -f
      - "/dev/mapper/{{ item.item.mapper }}"
  loop: "{{ patroni_playbook_existing_luks.results }}"
  loop_control:
    label: "{{ item.item.name }}"
  when: item.rc == 1 or (patroni_create_wipe_existing_cluster | bool)
  changed_when: true

- name: Remove OpenBao-managed volumes from crypttab
  ansible.builtin.lineinfile:
    path: /etc/crypttab
    regexp: "^{{ item.mapper | regex_escape }}[ \\t]+"
    state: absent
  loop: "{{ patroni_playbook_volumes }}"
  loop_control:
    label: "{{ item.mapper }}"
  notify: Reload systemd

- name: Install the mount guard used by the service units
  ansible.builtin.copy:
    src: patroni-require-volume
    dest: /usr/local/sbin/patroni-require-volume
    owner: root
    group: root
    mode: '0755'

- name: Mount each data volume and persist it in fstab
  ansible.posix.mount:
    path: "{{ item.path }}"
    src: "/dev/mapper/{{ item.mapper }}"
    fstype: "{{ patroni_create_volume_fstype }}"
    opts: defaults,noauto,x-systemd.requires=patroni-unlock-volumes.service,x-systemd.after=patroni-unlock-volumes.service
    state: mounted
  loop: "{{ patroni_playbook_volumes }}"
  loop_control:
    label: "{{ item.path }} <- /dev/mapper/{{ item.mapper }}"

- name: Install the OpenBao volume unlock helper
  ansible.builtin.template:
    src: openbao-wrappers/unlock-volumes.j2
    dest: /usr/local/libexec/patroni/unlock-volumes
    owner: root
    group: root
    mode: '0700'

- name: Install the OpenBao volume unlock service
  ansible.builtin.template:
    src: systemd/patroni-unlock-volumes.service.j2
    dest: /etc/systemd/system/patroni-unlock-volumes.service
    owner: root
    group: root
    mode: '0644'
  notify: Reload systemd

- name: Apply the OpenBao volume unlock service definition
  ansible.builtin.meta: flush_handlers

- name: Enable and start the OpenBao volume unlock service
  ansible.builtin.systemd_service:
    name: patroni-unlock-volumes.service
    enabled: true
    state: started

- name: Set ownership of each mounted volume
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: "{{ item.owner }}"
    group: "{{ item.owner }}"
    mode: '0700'
  loop: "{{ patroni_playbook_volumes }}"
  loop_control:
    label: "{{ item.path }}"
