---

- name: Verify access to the selected recovered database (optional)
  ansible.builtin.command:
    argv:
      - "{{ patroni_create_vars_postgres_bin }}/psql"
      - "--dbname={{ db }}"
      - --no-psqlrc
      - --set=ON_ERROR_STOP=1
      - --command=SELECT 1;
  become_user: postgres
  changed_when: false
